# Per-client-IP rate limits. This file is included in the http block, so zones can be declared here.
# shortcut: keyed on $remote_addr, which assumes nginx is the edge; behind a load balancer, use set_real_ip_from first.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Redirect HTTP → HTTPS
server {
    listen 80 default_server;
    server_name taskflow-qa.matthewrkilleen.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name taskflow-qa.matthewrkilleen.com;

    ssl_certificate     /etc/letsencrypt/live/taskflow-qa.matthewrkilleen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskflow-qa.matthewrkilleen.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    limit_req_status 429;

    # Serve Angular app — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stricter limit on credential endpoints to slow brute-force and signup abuse
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        # Regex locations can't strip the prefix via proxy_pass, so rewrite /api/auth/... to /auth/...
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the backend service
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        # The trailing slash replaces the matched /api/ prefix; controllers are mapped without it.
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
